[package]
name = "desktop-monitor"
version = "0.1.0"
edition = "2021"
description = "Native system monitor — per-core CPU, memory, processes, disks and interfaces via sysinfo, sampled at 1 Hz."
license = "MIT"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"

[profile.release]
lto = true
opt-level = "s"
strip = true
codegen-units = 1
